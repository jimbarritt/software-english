name: Release

# Manual only: run from the Actions tab, `gh workflow run`, or the
# GitHub API (`workflow_dispatch`). This repo has no version-bearing
# manifest file (no package.json equivalent), so the version is a
# typed input, same as the two tags already on this repo (v0.0.1,
# v0.0.2) were created by hand.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, no leading v (e.g. 0.0.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the tag
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be plain semver, no leading v (got: $version)"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse to re-release an existing tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists."
            exit 1
          fi

      - name: Find the previous release tag
        id: prev_tag
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build release notes from the commit log
        # --generate-notes summarises merged PRs; this repo ships by
        # pushing straight to main, so that always comes back empty.
        # Build notes from git log instead.
        id: notes
        run: |
          set -euo pipefail
          prev="${{ steps.prev_tag.outputs.prev }}"
          notes_file="$(mktemp)"
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
            echo "## Changes since $prev" >> "$notes_file"
          else
            range="HEAD"
            echo "## Changes" >> "$notes_file"
          fi
          echo >> "$notes_file"
          git log "$range" --no-merges --pretty=format:'- %s (%h)' >> "$notes_file"
          echo >> "$notes_file"
          if [ -n "$prev" ]; then
            echo >> "$notes_file"
            echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${prev}...${{ steps.version.outputs.tag }}" >> "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"
