# Software English rule catalogue — machine-readable.
# Each entry names a tier ("deterministic" or "inference-based") and a
# severity ("error", blocking, or "warning", advisory-only). See SPEC.md
# §2. Parsed directly by claude-plugins/software-english-lint/scripts/
# software_english_lint.py via Python's stdlib tomllib.

version = "0.1"

[[rules]]
id = "vocabulary-membership"
tier = "deterministic"
check = "vocabulary"
severity = "warning"
description = "Every word outside a literal token (SPEC §6.3) must appear in the approved vocabulary (operations, structure, qualities, connectives). Runs at warning severity while the vocabulary is a seed set — see §6.1 — so an unlisted but valid word does not block a turn."
sources = [
  "vocabulary/operations.tsv",
  "vocabulary/structure.tsv",
  "vocabulary/qualities.tsv",
  "vocabulary/connectives.tsv",
]

[[rules]]
id = "banned-word"
tier = "deterministic"
check = "substitution"
severity = "error"
description = "A word or phrase in the banned list must be replaced with its approved fix, or cut where the fix is CUT."
sources = ["vocabulary/banned.tsv"]

[[rules]]
id = "no-em-dash"
tier = "deterministic"
check = "character-ban"
severity = "error"
code_span_severity = "warning"
character = "—"
description = "Do not use an em dash (SPEC §3.5), in a sentence or in a list item. No exception for a use that reads correctly, the same precedent as a flat vocabulary/banned.tsv entry. A code fence is exempt. A code span is exempt when it reads as code, has no space touching the dash, opens with an article (\"the\"/\"a\"/\"an\"), or carries an inner quote; any other code span with an em dash in it gets a finding at code_span_severity, not error."

[[rules]]
id = "sentence-length"
tier = "inference-based"
check = "sentence-length"
severity = "warning"
max_words = 20
description = "A sentence must not exceed the configured word limit (SPEC §3, §10). Inference-based because judging whether a long sentence should split, versus is one irreducible fact, needs context; the word count itself is a deterministic-checkable number, but the rule's intent is advisory. The limit is a ceiling, not a target: do not meet it by splitting one fact into a run of clipped sentences (no-clipped-sentence-run, SPEC §3.6)."

[[rules]]
id = "no-clipped-sentence-run"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Vary sentence length, and keep one fact in one sentence where it fits (SPEC §3.6). A run of three or more consecutive short sentences in one paragraph is a fault when the run splits one fact into clipped pieces and a chain of pronouns ('it', 'its', 'their', 'this') joins the pieces back together. The rhythm is staccato, and a pronoun that changes referent from one sentence to the next makes a reader resolve each one again. The 20-word limit (sentence-length, SPEC §3.2) is a ceiling, not a target, and it pushes writing toward this shape: do not meet the limit by splitting one fact into several clipped sentences. One fact takes one sentence, up to the limit; a short fact takes a short sentence. Example: 'That design defines two events on two topics. Its Processing section states them. Their contract is below. It states the payload of each, the topic and message key of each, and the AVRO schema of each. It also states where each is registered.' Four of the five sentences are under ten words, and together they state one fact: what the design defines, and where. 'Their contract is below' states no fact. 'Its', 'Their', 'It', 'It' refer in turn to the design, the events, and the contract, so the referent changes between consecutive sentences. Fix: merge the pieces of one fact into sentences of different lengths, and name the noun wherever a pronoun's referent would change: 'The design defines two events in its Processing section, each on its own topic. For each event, the contract below specifies the payload, the topic, the message key, and the AVRO schema. The contract also records where each schema is registered.' Judge in two steps: first find a run of three or more consecutive sentences in one paragraph, most of them under about ten words; then check the run for a split fact: a sentence that states no complete fact alone, or a sentence after the first whose subject is a pronoun or a possessive pointing back into the run, especially one whose referent differs from the pronoun before it. Report a finding only where both steps match. Not this fault: a run of short sentences that each state a separate, complete fact with a named subject; a list item (SPEC §3.4), which is short by design; a numbered sequence of steps in a Tutorial or a How-to guide (SPEC §7.8). Fix by merging, not by padding: a merged sentence adds no word that states no fact (SPEC §5.4, §7.12), and still obeys sentence-length and one fact per sentence (SPEC §3.1), since the fields of one contract are one fact. Telling one fact split across sentences apart from several facts stated in turn needs judgement, so this stays inference-based."

[[rules]]
id = "no-continuous-tense"
tier = "deterministic"
check = "tense-pattern"
severity = "error"
pattern = '\b(is|are|was|were)\s+([A-Za-z]+ing)\b(?!-)'
stoplist = [
  "during", "nothing", "something", "anything", "everything", "morning",
  "evening", "spring", "king", "thing", "string", "ring",
]
description = 'Do not describe system behaviour in the continuous tense. Example fault: "the consumer is testing the connection". The stoplist excludes matches where the "-ing" word is not a verb, and a following hyphen excludes a compound adjective ("learning-oriented").'

[[rules]]
id = "no-perfect-tense-for-behaviour"
tier = "inference-based"
check = "tense-pattern"
severity = "warning"
pattern = '\b(has|have|had)\s+([A-Za-z]+(?:ed|en))\b'
stoplist = ["ten", "seven", "often", "even", "open", "golden", "chicken", "broken"]
description = "Avoid the perfect tense for behaviour, except to state a historical fact simple past cannot (SPEC §4). Inference-based because telling the two apart needs judgement — this runs advisory-only, never blocking."

[[rules]]
id = "anthropomorphism-fixed-list"
tier = "deterministic"
check = "anthropomorphism"
severity = "error"
lookback_words = 4
subject_gate = "not-human-subject"
subject_signal = ["any word within lookback_words before the match, in the same clause, other than a word from human_referents or its plural"]
human_referents = [
  "user", "customer", "person", "people", "reader", "writer", "author",
  "reviewer", "maintainer", "operator", "developer", "engineer",
  "learner", "student", "human", "team", "contributor",
  "i", "me", "you", "we", "us", "he", "him", "she", "her", "they", "them",
  "who", "someone", "anyone", "everyone", "nobody",
]
word_list = [
  "wants", "tries", "knows", "believes", "decides", "gives up",
  "waits patiently", "gets confused", "has patience", "is happy",
  "is confused", "is smart", "understands", "thinks", "remembers",
  "forgets", "hopes", "assumes", "agrees", "refuses", "prefers", "cares",
  "worries", "struggles", "learns", "notices", "realizes", "realises",
  "expects", "intends", "plans", "chooses", "likes", "dislikes",
  "enjoys", "hates",
  "asks", "tells", "answers", "says", "disagree",
  "arrives", "arrive", "goes", "comes", "come", "enters", "enter",
  "leaves", "leave", "moves", "move",
]
description = "A system, a service, a component, a process, or any other subject that is not a person has no human trait, feeling, or intent, and does no act of communication or of motion (SPEC §5.1). Fires unless a human referent comes within lookback_words before the match, in the same clause: a word from human_referents, or its plural. Any other subject counts as a system, including a proper noun such as a product, vendor, or service name (\"Postgres knows about the row\", \"the record arrives with a default status\"). Does not fire when nothing precedes the match in its clause, or only an imperative lead (\"tell the user\", \"do not leave a heading empty\", the start of a wrapped line), or when the word directly before the match is a determiner other than \"this\" or \"that\" (\"the answers\", \"a move\"), since the match is then a noun. A possessive (\"the user's database\") is not the subject, so it does not count as a human referent. A person named by a proper noun is not in human_referents: name the role (\"the maintainer\"), or add the skip-line marker. \"disagrees\", \"complains\", \"travels\", \"lands\", and \"reaches\" are in vocabulary/banned.tsv, so banned-word reports them. \"comes in\" and \"come in\" are also in vocabulary/banned.tsv: banned-word reports them, and this rule does not report the \"comes\" or \"come\" inside them. Distinct from abstract-location (SPEC §5.2), which keeps a system-subject check, because each of its verbs also has a literal or an adjectival use (\"a live install\", \"the rest of the file\")."

[[rules]]
id = "abstract-location"
tier = "deterministic"
check = "substitution"
severity = "error"
lookback_words = 4
subject_signal = ['a word from vocabulary/structure.tsv, excluding human referents (e.g. "user")', "it", "this", "that"]
word_list = [
  "sit", "sits", "sitting", "live", "lives", "lived", "living",
  "reside", "resides", "resided", "dwell", "dwells", "dwelled",
  "stand", "stands", "stood", "lie", "lies", "lay", "rest", "rests",
  "rested", "hang", "hangs", "hung", "float", "floats", "floated",
]
description = 'A location or motion verb ("sits", "lives", "resides") standing in for a plain classification verb ("is", "belongs to") when the subject is abstract, not physical — the same fault as "reach" or "carry" in banned.tsv, but not blockable as a flat banned word, because each of these verbs is correct English for a physical or human subject ("the operator sits at the console"). Fires only when a structure noun other than a human referent, or a system-referring pronoun, comes within lookback_words before the match. This check is narrower than the one anthropomorphism-fixed-list uses, because each verb here also has a literal or an adjectival use. The fault is a default of fluent English, not a vocabulary gap — a writer actively avoiding it can still produce it without noticing. A verb of motion ("goes", "comes", "moves", "leaves", "arrives") is on the anthropomorphism-fixed-list, with its not-human-subject check: a motion verb takes a person as its subject, never a system or a structure. A positional idiom with no verb of its own ("pass over", "behind the serialiser") is on neither list; no-metaphor-or-analogy covers it at the inference tier. "belongs to" as the fix here stays correct: its object is a set or a whole. no-ownership-or-entitlement-for-a-system (SPEC §5.11) judges "belongs to" only where its object is a system said to own the subject.'

[[rules]]
id = "anthropomorphism-paraphrase"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A paraphrase of the anthropomorphism fault not on the fixed list (SPEC §5.1) — needs a model, not a linter. A claim of ownership or entitlement ('its own copy', 'is entitled to', 'deserves') gives a system a status, not a mind: report it under no-ownership-or-entitlement-for-a-system (SPEC §5.11)."

[[rules]]
id = "vacuous-classification-property"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
trigger_phrases = [
  "exactly one", "at most one", "mutually exclusive",
  "collectively exhaustive", "no overlap", "one and only one",
]
description = 'A property of a set that a reader can already see from its members adds no fact (SPEC §7.6). Two faults. Taxonomy property: a cardinality or exclusivity property ("exactly one", "at most one", "mutually exclusive", "collectively exhaustive", "no overlap", "one and only one") stated near a taxonomy definition ("defines N tiers/kinds/categories/levels"), where the property already follows from the member definitions and no mechanism reads it. Fault: "The cache defines a memory tier, a disk tier, and a remote tier. Every entry belongs to exactly one tier." Fix: delete the second sentence; where a check enforces the constraint, state it in that check. Count signpost: a sentence that starts with a numeral or a number word ("two", "three", "2", "3") and states only how many items come directly after it. A reader counts the items, so the count states no fact. Trigger: a number word at the head of a sentence, followed by a colon and a list, by an ordered or unordered list, or by the same number of sentences that each name one item. Fault: "Three costs follow from that:" or "Three routes drop an entry:", each followed by a three-item list. Fix: delete the sentence and start with the first item; where the sentence names what the items belong to, keep that noun and cut the count ("The retry policy adds these costs:"). Not this fault: a count that states a fact beyond the number of items, such as a part of a larger set ("Three of the five routes drop an entry:") or a bound a mechanism checks; a count whose items do not come directly after it, such as a summary (SPEC §7.1) that states a count the body expands in separate sections; a number that is a quantity, not a count of the items ("Three retries run before the dead-letter write."). The phrases "two things" and "three things" are on the fixed list (vocabulary/banned.tsv): report them under banned-word only. Distinct from no-cadence-device (SPEC §8.1), which restates the sentence before it; a count signpost announces the items after it. Distinct from no-entailed-restatement (SPEC §7.12), the general case. Both triggers are findable in the text, but whether a found instance states a fact beyond the count needs judgement, so this stays inference-based.'

[[rules]]
id = "define-before-use"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Define a named term before its first normative use (SPEC §7.4). Introducing a term and relying on it in the same sentence, without stating what it means, forces a reader to infer the definition from usage instead. A definition clause is any of these: a sentence stating what the term means ('X means', 'X refers to', 'X is defined as'); the term set in bold at its introduction; a glossary or table entry; a link to where another document defines it; or a parenthetical gloss at the first use. Headings are in scope: a term used in a heading before the body defines it is used before it is defined. Fault: 'The router sends an order in one of two modes: on the primary queue, with a priority flag, or on a queue of its own.' 'mode' names no term of the domain, and no sentence defines it anywhere in the document. Fix: use the names the document already defines, or define the term before its first use; better, state the two cases directly, with no coined term at all: 'The router sends an order to the primary queue with a priority flag set, or to a queue of its own.' Test: for each term the intended reader does not already use, find the sentence that defines it, and check that the sentence precedes the term's first use. Not this fault: a term of the domain the intended reader already uses ('order', 'router'); a word in the approved vocabulary (SPEC Appendix D); quoted material (SPEC §6.3) or a literal token (SPEC §6.2). A word outside the approved vocabulary is not, by itself, this fault: vocabulary-membership already reports each such word, one occurrence at a time; this rule fires only where the term also recurs with no definition clause. Distinct from no-mechanism-for-outcome (SPEC §7.13): an undefined term there is a symptom, not the fault, since the mechanism does not belong in that reader's sentence at all, defined or not. Distinct from no-abstract-stand-in-for-artefact (SPEC §7.15): where the undefined noun substitutes for an artefact the sentence can name, report it under no-abstract-stand-in-for-artefact only, since naming the artefact removes the undefined term too. Distinct from no-unstated-presupposition (SPEC §7.19): that rule covers a noun that is understood but depends on a fact the document never states; this rule covers a term whose meaning itself is never stated. A lookup can find a word outside the approved vocabulary that recurs in a document. Whether the intended reader already knows it, and whether a sentence defines it, needs judgement, so this stays inference-based."

[[rules]]
id = "no-unanchored-reference"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A definite reference ('the design', 'the decision', 'the plan', 'this change', and similar) with no antecedent inside the document (SPEC §7.5). A reader without the writer's context cannot resolve it. A reference is anchored when the document names its referent before the reference, or when the reference points to where the document defines it ('the approach in §3'). The fault can appear in a heading or in body prose: every heading is in scope, not only the body. Heading fault, definite noun: 'Facts that shape the design' in a document that defines no design. Heading fault, question shape: a heading of the form 'What this <verb>' or 'Which <noun> <verb>', where no noun follows 'this', or where the noun is a part of a whole the document does not name. Examples: 'What this costs' and 'What this removes', where no noun follows 'this'; 'Which process owns the cache', in a document that defines no cache; 'What an entry contains', in a document that names no store the entries are part of. A bare 'this', 'that', or 'it' in a heading is a fault even under a parent heading that names a subject, because a heading is also read alone: in a contents list, in a link, or in a search result. Fix: name the referent in the heading ('What the retry policy costs', 'What a session-store entry contains'). For a definite noun, defining the referent before the heading also fixes it. Not this fault: a question-shaped heading that names its referent, or whose noun the document defines before the heading. The question shape is not the fault; the missing referent is. Distinct from no-unstated-presupposition (SPEC §7.19): a definite phrase with a cardinal or a completed-act participle ('the four surveyed carriers', 'the agreed plan') needs an earlier statement of a fact, not only an earlier noun. Where both rules match one phrase, report it under that rule only. Not a banned-word entry, because each phrase is correct when the document defines its referent. Whether an antecedent exists needs the whole document, not a lookup, so this stays inference-based."

[[rules]]
id = "no-process-narration"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A document about a decision states the decision and the reason for it (SPEC §7.7). It does not narrate how the decision was reached: who asked, what was discussed, how many attempts came before it, or what changed between drafts. Recognising process narration versus a stated fact needs judgement, so this stays inference-based."

[[rules]]
id = "document-type-template"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Identify a document's target type (RFC, ADR, Design, API Design, PR Description, Specification, Technical Manual, and similar — SPEC §7.8) before writing it. A type governs structure and required sections beyond Software English's own sentence-level rules. See SPEC Appendix F and templates/ for a by-reference local summary of each type's canonical structure — Software English does not redefine these structures itself. Tell Design and Reference apart before judging either: a Design document states a design that is chosen and not yet built, so it holds what exists, what is decided, and what is still open, all at once, while a Reference document describes a system that already exists. Decision state separates the neighbouring types: an ADR records one decision already taken, an RFC proposes one for an answer, a Design document holds many, some still open. API Design is a specialisation of Design (SPEC Appendix F, templates/api-design.md). It keeps Design's seven sections, with API-specific content added. Treat it as Design for every other rule conditioned on document type. A PR Description (SPEC Appendix F, templates/pull-request.md) states one change already made and the evidence that it works: the text of a pull request, written for a reviewer who has not seen the diff. It is not a Reference document, and a commit message or a pull-request comment is not a PR Description. One rule fires on a PR Description and on no other type: no-check-without-result (SPEC §7.16). no-abstract-stand-in-for-artefact (SPEC §7.15) fires on every type; on a PR Description its scope is the problem statement and the change statement. Judge a PR Description as a whole, read end to end as a reviewer reads it, not only the lines an earlier pass flagged. A clean deterministic-tier result is necessary, not sufficient. Recognising which type a document should follow needs judgement, so this stays inference-based."

[[rules]]
id = "no-planning-content-in-reference"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
applies_to_document_type = "reference"
description = "A document of Diátaxis type Reference (SPEC §7.9) contains no planning or task-oriented content: no open question, no next step, no statement of who does work or when, no pointer to a plan document, and no statement of the document's own purpose relative to a task in progress. A sentence that states where planning content belongs is itself planning content. Conditional on document type: it fires only after document-type-template assigns the type Reference, because the same content is correct in a plan, an RFC, or an ADR. It never fires on a Design document, or on an API Design document, a specialisation of Design. Both are named in SPEC Appendix F, templates/design.md and templates/api-design.md. Both contain an open-questions section and a future-extension section as correct content. The Design exemption covers those two kinds of content only. A work-breakdown sentence, or an issue-tracker id used as the pointer to later work, is a fault on every document type, Reference included. Report it under no-work-breakdown-or-tracker-pointer (SPEC §7.14), not under this rule. Check the type before reporting any finding under this rule, because a design document typed as Reference by mistake reports one against every entry in both sections. Software English's own addition, reasoned from Diátaxis's 'describe, and only describe' guidance, which names no such category. Recognising planning content needs judgement, so this stays inference-based."

[[rules]]
id = "no-work-breakdown-or-tracker-pointer"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A document does not divide its subject into units of work, and does not point to later work by an issue-tracker id (SPEC §7.14). Two faults. Work-breakdown narrative: a sentence that states which part of the subject one unit of work covers (this piece of work, this change, this phase, this ticket) and which part a later unit covers (a later piece of work, a follow-up, phase two). That is a scheduling choice, not a fact about the subject. Issue-tracker pointer: an issue or pull-request id ('PROJ-142', '#42', 'repo#slug') given as the pointer to work the document does not itself state. The id names no fact inside the document, and it stops resolving once the tracker is migrated, renamed, or closed. Fault: 'This piece of work covers the read path. The write path follows in a later piece of work, tracked in PROJ-142.' Fix: state the boundary as a fact of the subject, with no unit of work and no id: 'A write path: the order store accepts writes through the same schema.' Unconditional on document type: it fires on every type, Design, API Design, PR Description, RFC and ADR included, because neither fault states a fact about the subject in any of them. Judge in two steps: first find each sentence that names a unit of work or an issue-tracker id; then check whether the sentence divides the subject between units of work, or uses the id in place of a stated fact about later work. Report a finding only where the second step matches. Test: remove the unit of work and the id; keep any fact about the subject that remains, and delete the sentence if none remains. Not this fault: an entry in a section headed References, Normative References, Informative References, or Bibliography, citing an issue or a pull request by its id and its title, as a source; an open question or a future extension in a Design or API Design document that names no unit of work and no id, since SPEC §7.9 governs those by type and exempts them; a Lab Notebook entry naming the task it belongs to, or a Portfolio Journal entry recording work already done, since neither points to later work; in a PR Description, a closing-keyword line ('Closes #11', 'Fixes #10') naming an issue the change resolves, since a tracker reads the line to close the issue and the line points to no later work. A sentence in a PR Description that points to a follow-up pull request or a later change is still this fault. Distinct from no-planning-content-in-reference (SPEC §7.9): that rule covers every kind of planning content, in a Reference document only. This rule covers two kinds, in every document, and takes precedence: report a work-breakdown sentence or a tracker pointer under this rule only, never under both. Distinct from no-unanchored-reference (SPEC §7.5): the id can resolve and still be this fault. Telling a unit of work apart from a part of the subject needs judgement, so this stays inference-based."

[[rules]]
id = "no-metaphor-or-analogy"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "State a fact or a mechanism directly (SPEC §5.5). Do not explain it through a comparison to something else (a metaphor or an analogy, e.g. 'the retry queue is the system's safety net'). A formulaic transport metaphor, possession verb, or motion idiom on the fixed list (vocabulary/banned.tsv, for example 'rides on', 'piggyback', 'travels', 'carries', 'holds', 'where this leaves', 'as they come') is caught by banned-word. A system, a structure, or an abstract concept has no hands, so carry and hold are on the fixed list for every subject: 'the response contains the order list', not 'the response holds the order list'. Also watch for an abstract subject (a decision, a contract, a schema, a design, a reader's attention) given a verb of physical motion or position: 'the published schema does not move' (does not change), 'the notice should not go past a reader' (a reader should not miss the notice), 'reject the option rather than pass over it' (omit it), 'renamed behind the serialiser' (renamed without changing the response), 'the design comes from the reference implementation' (is specified in). Each of these verbs is also correct for a literal operation on a structure noun ('the file does not move', 'a second pass over the input', 'the service runs behind the proxy'), so only judgement can tell the two apart. Also watch for a container-and-form noun (shape, layer, space) applied to a schema, a type, an API, or a contract in place of the fields, values, or operations it defines: 'a version fixed now would name a shape the schema does not have' (would refer to fields the schema does not contain), 'the contract is a thin layer over the table' (the contract has the same fields as the table), 'the type leaves no space for a null' (the type does not accept a null). The noun 'surface' ('the API surface') is on the fixed list and is caught by banned-word. Each of these nouns also has a literal use: 'the schema contains a version field' (a schema containing a field is literal; the fault is the form noun, not the verb contain), 'the error shape as a type' where the type then lists the fields, 'the network layer', 'disk space', so only judgement can tell the two apart. A metaphor or an analogy not on the fixed list needs judgement to recognise, so this stays inference-based."

[[rules]]
id = "honest-self-qualifier-paraphrase"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A paraphrase of the self-qualifying 'honest' fault (SPEC §5.6) not on the fixed list (vocabulary/banned.tsv), for example 'if I'm honest, the design needs a rethink'. 'Honest' also names a real, checkable property (an honest mistake, an honest broker) — telling that use apart from the self-qualifier use needs judgement, so this stays inference-based."

[[rules]]
id = "no-contrastive-framing"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A sentence states what happens (SPEC §5.7). It does not state what does not happen, what a component cannot do, or how a case differs from one the reader has not asked about, since that answers an objection instead of the question. Marker words (\"the one exception\", \"cannot\", \"still\", \"the difference is\", \"not that\", \"unlike\") are not faults by themselves: \"cannot\" states a real, load-bearing limit as plainly as any other fact in a reference document. The fault is the sentence's shape, not any one word, so telling a defensive frame apart from a plain stated limit needs judgement."

[[rules]]
id = "no-undeclared-state-verb"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Where a document declares an explicit status set for an entity (an enum, a union type, a table of states, or a list of status values), a sentence about a state change of that entity names a declared value (SPEC §5.8). A verb that names no declared status is a fault. Example: 'when a sync settles', where the document declares the sync status set as pending, in_progress, failed, completed, and completed_with_errors, and no status is settled. Fix: name the declared status ('when the sync status changes to completed'), or list each status the verb covers. Judge in two steps: first find every declared status set in the document and the entity it belongs to; then check each verb whose subject is that entity, or one of its instances, and that describes a change of its state. Not this fault: a verb form of a declared value ('the sync fails' for failed, 'the sync completes' for completed); a verb about an entity with no declared status set; a verb that names an action, not a state change ('the sync reads the ledger'). Distinct from anthropomorphism-paraphrase: the verb gives the system no human trait. Distinct from no-metaphor-or-analogy: the verb need not be a metaphor; a plain verb such as 'finishes' or 'ends' has the same fault when it covers more than one declared status and names none. Distinct from SPEC §7.4's define-before-use: defining the verb would add a second name for states the document already names, which is the fault itself. Finding the status set needs comprehension of the document, not a lookup, and linking a verb to the entity whose status it changes needs judgement, so this stays inference-based."

[[rules]]
id = "no-catch-all-verb"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "One verb names one relation within a paragraph (SPEC §5.9). A content verb used more than once in one paragraph is a fault when its occurrences name different relations: one general verb stands in for several precise ones, and a reader cannot tell the relations apart. Example: 'That design defines two events on two topics. Its Processing section states them. Their contract is below. It states the payload of each, the topic and message key of each, and the AVRO schema of each. It also states where each is registered.' Here 'states' names three relations: a section that lists the events, a contract that specifies each field, and a contract that records where each schema is registered. Fix: name each relation, and use a distinct verb for each: 'The design defines two events in its Processing section, each on its own topic. For each event, the contract below specifies the payload, the topic, the message key, and the AVRO schema. The contract also records where each schema is registered.' Judge in two steps: first find each content verb that occurs more than once in one paragraph, ignoring an auxiliary or a copula (is, are, has, have, does, can, will); then state, for each occurrence, the relation it names between its subject and its object. Report a finding only where two occurrences name different relations, and name the precise verb for each. Not this fault: a verb repeated with the same relation each time ('each handler returns an error', or a list where each entry 'contains' its fields), since there the same verb is correct and a synonym would suggest a second relation; a term the document defines, which keeps its one name (SPEC §6.1); a repetition in a code span or a blockquote (SPEC §6.2, §6.3). Fix by naming the relation, not by cycling synonyms. Distinct from no-undeclared-state-verb: the verb need not describe a state change, and the document need not declare a status set. Distinct from no-metaphor-or-analogy: the verb is literal, only too general. Naming the relation each occurrence states needs comprehension, so this stays inference-based."

[[rules]]
id = "no-framing-device"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A declarative sentence states its fact as a plain clause (SPEC §5.10). A framing device wraps the fact in a frame that states nothing the plain clause does not: a cleft, a question, or an argument for a name. Three shapes are this fault, and they often occur together. First, cleft padding: a copula and a relative pronoun added around a plain clause. Signatures: 'X is what Y', 'it is X that Y', 'what X does is Y', 'X is the thing that Y'. Fault: 'the import is what reconciles the four structures'. Fix: 'the import reconciles the four structures'. Fault: 'it is the scheduler that orders jobs'. Fix: 'the scheduler orders jobs'. Fault: 'what the retry loop does is cap attempts at three'. Fix: 'the retry loop caps attempts at three'. Fault: 'the parser is the thing that reads each file'. Fix: 'the parser reads each file'. An identity reading does not exempt the shape: 'the primary key is what the index is built on' is the same fault (fix: 'the index is built on the primary key'), and so is 'the status is what the caller reads' (fix: 'the caller reads the status'). The fix is always the same: drop the copula and the relative pronoun, and put the focused phrase back in its place in the clause. Second, rhetorical-question framing: a question embedded as the subject or the object of a declarative, so the sentence asks or answers a question instead of stating the fact the question names. Signatures: 'asks one question', 'answers two questions', 'the question is whether', 'that raises the question of', 'named for that question'. Fault: 'The gateway asks one question of all four: can this order ship on this date, and what reference does the carrier call need.' Fix: 'The gateway needs two facts from all four: whether the order may ship on the date, and the reference the carrier call takes.' Third, naming-as-justification: a sentence argues for the choice of a name instead of stating what the named thing is. Signatures: 'is named for', 'is called X because', 'hence the name', 'the name reflects'. Fault: 'A dispatch slot is named for that question rather than for the structure it was imported from.' Fix: state what the type is, 'A dispatch slot is a date range, a status, and a carrier reference.' Test: rewrite the sentence as its plain clause; if a reader loses no fact, the frame was a framing device. Judge in two steps: first find each sentence in body prose that matches a signature above, or whose main verb takes a question, an answer, or a name as its subject or object; then write the plain clause the frame wraps, and check whether the frame states a fact the plain clause does not. Report a finding only where it states none, and give the plain clause as the fix. Not this fault: a 'what' clause or a 'which' clause that is the object of a content verb, not the complement of a copula ('the response contains what the caller requested', 'the log records which orders failed'); an indirect question that states the fact through its verb ('the config states whether retries are enabled', 'the table lists which jobs ran'); 'X is the N that Y' where N is a noun that classifies X ('the cache is the store that the reader queries first'), since the classification is a fact; a literal exchange between components ('the server answers each request with a status code'); an entry in a section that lists open questions, such as 'Open questions' in a design document, which states a question with no answer yet; a name stated as a fact a reader needs, such as a rename ('the field slot_ref was renamed from booking_ref in version 2') or a naming convention ('topic names follow domain.event'); the choice of a name in the Decision section of an ADR, where the name is the decision; a heading, which no-question-or-argument-heading (SPEC §7.18) judges; quoted material (SPEC §6.3) or a literal token (SPEC §6.2). Distinct from no-question-or-argument-heading (SPEC §7.18): that rule covers headings only, and this rule covers body prose only, so the two never judge one line. Distinct from no-contrastive-framing (SPEC §5.7): where an 'X rather than Y' contrast argues for a name, report the sentence under this rule only, since stating what the type is removes the contrast too; a contrast about behaviour stays a no-contrastive-framing finding. Distinct from no-catch-all-verb (SPEC §5.9): that rule ignores the copula of a cleft; where a framing verb such as 'asks' or 'answers' also repeats in the paragraph, report the sentence under this rule only, since the fix removes the verb. Distinct from anthropomorphism-paraphrase (SPEC §5.1) and no-metaphor-or-analogy (SPEC §5.5): where a system 'asks' or 'answers' a question that frames a fact, report it under this rule only, since the fix states the fact and removes the verb; a human trait or a metaphor outside a question frame stays a finding under those rules. Distinct from no-abstract-stand-in-for-artefact (SPEC §7.15): where 'question' or 'answer' stands for the facts the sentence frames ('named for that question'), report it under this rule only; another abstract noun that stands for an artefact stays a finding under that rule. Distinct from no-entailed-restatement (SPEC §7.12): that rule cuts a clause that follows from another fact, while this rule keeps the one clause and removes the frame around it. Distinct from no-remark-about-the-writing (SPEC §5.3): where the plain clause of a cleft still states no fact about the system ('that is what the next section is for'), report it under that rule only, since the fix deletes the sentence. A parser can flag the cleft signatures, but telling a cleft apart from a 'what' clause or a classifying noun, and recognising a question or a name used as a frame, needs judgement, so this stays inference-based."

[[rules]]
id = "no-ownership-or-entitlement-for-a-system"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
trigger_phrases = [
  "own", "its own", "of its own", "in its own right", "belongs to",
  "is entitled to", "has a right to", "deserves", "earns", "claims",
  "is owed",
]
description = "A possession or an entitlement construction needs a possessor that is a person or an organisation of people (SPEC §5.11). A plain possessive states a fact with any possessor: a service has a config, a record has an identifier. The fault is a layer added on top of it, which gives a system, a service, a component, a process, a document, a record, or an abstract concept a standing it cannot have: the standing to own a thing, or to claim a desert. The family: emphasis on a possessive ('own', 'its own', 'of its own', 'in its own right') and entitlement ('belongs to', 'is entitled to', 'has a right to', 'deserves', 'earns', 'claims', 'is owed'). Fault: 'The dispatch queue's own copy of the manifest is rebuilt nightly.' Cutting 'own' changes nothing the sentence states. Fix: cut the layer and keep the possessive, 'The dispatch queue's copy of the manifest is rebuilt nightly.' Fault: 'The cache is a service in its own right.' Fix: 'The cache is a service.' An entitlement has no plain possessive under it: state the allocation, and name the mechanism that makes it. Fault: 'Each partition is entitled to one consumer in the group.' Fix: 'The group coordinator assigns each partition to one consumer in the group.' Fault: 'Each lock belongs to the process that acquired it.' Fix: 'Only the process that acquired a lock can release it.' Fault: 'The retry path deserves a dedicated thread pool.' Fix: 'Run the retry path on a dedicated thread pool, so a burst of retries does not delay a new request.' Judge in two steps: first find the possessor of each family member, which is the subject of 'deserves', 'earns', 'claims', 'is owed', 'is entitled to', or 'has a right to', the object of 'belongs to', or the noun or pronoun before 'own'; then, where the possessor is not a person or an organisation of people, cut the layer or replace it with a plain possessive, 'has', or the mechanism that allocates the thing, and check whether a reader loses a fact. Report a finding only where the possessor is not a person or an organisation of people and the replacement loses no fact. Not this fault: a plain possessive or a plain 'has' with any possessor ('the service's config', 'the record's identifier', 'the queue has three consumers'); a possessor that is a person or an organisation of people ('the user's own pen', 'the author's own draft', 'the team deserves the time', 'the company owns the domain name'), since an organisation can own property in law; an idiom of standing about a person ('she is a maintainer in her own right'); 'own' that states a fact, one each and not shared ('each event on its own topic', 'each worker keeps its own copy of the cache'), since cutting it loses the fact that no two share one; 'belongs to' as classification or membership, the plain verb SPEC §5.2 names ('a rule belongs to one tier', 'the record belongs to partition 3'), where 'is a member of' or 'is part of' states the same fact; a term of art that names an operation, not a standing ('the worker claims the next job', where a claim is a lease the queue records; 'the deposit earns interest'); 'claims that' in the sense of states ('the README claims that the tool supports Windows'), which names no standing, and where it marks the writer's doubt SPEC §5.3 applies; quoted material (SPEC §6.3) or a literal token (SPEC §6.2). Distinct from anthropomorphism-fixed-list and anthropomorphism-paraphrase (SPEC §5.1): those cover a category error about mind (wanting, trying, knowing, deciding), and this rule covers a category error about status. Neither entails the other, and the fixes differ: SPEC §5.1 names the mechanism, and this rule cuts the added layer and keeps the possessive. Where one sentence has both ('the cache knows its own size'), report two findings, one under each rule. Distinct from abstract-location (SPEC §5.2): that rule names 'belongs to' as the plain classification verb, and that use is correct here too, since its object is a set or a whole, not a possessor; this rule fires on 'belongs to' only where the object is a system said to own the subject, so the two rules never judge one verb. Distinct from no-metaphor-or-analogy (SPEC §5.5): that rule bans 'carry' and 'hold' as verbs of physical possession and replaces each with 'has' or 'contains'; this rule keeps the plain possession verb and cuts an emphasis or an entitlement added to it. 'In its own right' and 'earns its place' are idioms, not comparisons: report them under this rule only. Distinct from SPEC §5.3: where no fact remains once a judgement of desert is cut ('the refactor deserves praise'), report it under SPEC §5.3 only, since the fix deletes the sentence; where a fact remains, report it under this rule only. Distinct from SPEC §5.4: 'own' adds no information, like a hedge, but it attaches to a possessor, and the possessor decides the fault; report it under this rule only. Distinct from SPEC §6.1, which judges an approved word by lookup: no word in this family is in the approved vocabulary, so vocabulary-membership reports each one as unlisted whatever the possessor, and this rule says which uses are faults. Not a banned-word entry, and not a fixed list with a subject check like anthropomorphism-fixed-list: each construction is correct with a person as the possessor, and a subject check would also fire on 'belongs to' as classification, on 'own' meaning one each, and on a term of art. A parser can find each member of the family, but whether the possessor is a person, and whether the cut loses a fact, needs judgement, so this stays inference-based."

[[rules]]
id = "no-out-of-scope-comparand"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A reader-facing document names only what the reader's task needs (SPEC §7.10). A comparison to another artefact outside that task is a fault even when stated plainly, with no contrastive framing (§5.7), when the reader has no reason to know the other artefact. Distinct from §7.5's no-unanchored-reference: the reference can resolve fine (a working link); the fault is that the reader's task never needed it. Recognising what a reader's task needs, as against what the writer's own working context happened to include, needs judgement, so this stays inference-based."

[[rules]]
id = "no-entailed-restatement"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A clause that follows from a fact stated in the same sentence or the one before it, given what the intended reader already knows, adds nothing (SPEC §7.12). Cut it; keep the fact it derives from. Sibling of §7.6, which covers the same fault inside a taxonomy definition specifically; this is the general case. Not this fault: a clause naming a distinct consequence, not a rephrase; a Tutorial-type document (§7.8), where restating a fact for a learner is the genre's purpose. High false-positive risk, since the test rests on a model of reader knowledge: runs at warning severity, never error."

[[rules]]
id = "no-mechanism-for-outcome"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A reader-facing sentence states an outcome at the level the reader acts on (SPEC §7.13). It names an implementation unit (a hook, a handler, a count of components) only where the reader's task acts on that unit. Test: change the mechanism and keep the outcome; if the sentence's use to the reader does not change, the mechanism was at the wrong level. Distinct from §7.4's define-before-use: an undefined term is a symptom here, not the fault, and defining it would not fix the sentence."

[[rules]]
id = "no-abstract-stand-in-for-artefact"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A sentence about an artefact names it (SPEC §7.15): a file, a type, a schema, a field, a record, a table, an endpoint, a request, a response, a message, or a topic. An abstract noun used in place of that artefact is a fault, because a reader cannot check a sentence against a noun that names nothing in the system. In a PR Description the common stand-ins are 'evidence', 'context', 'visibility', 'coverage', and 'insight'. In a Reference or a Design document they are structural nouns: 'shape', 'form', 'flavour', 'placement', 'arrangement', 'positioning', and 'layout'. The noun 'surface' is on the fixed list (vocabulary/banned.tsv), and banned-word catches it. Fault: 'The record written to the downstream system contained no evidence.' The missing thing was a receipt file attached to the record. Fix: 'The record written to the downstream system had no receipt file attached.' Fault: 'The report gave the operator no visibility.' Fix: 'The report listed no failed orders.' Fault: 'The adapter maps all four shapes to this record.' 'Shapes' stands for four vendor payload structures, and 'this record' for the schema they are converted to. 'Record' is on the artefact list, and is still a stand-in here: the sentence refers to a schema, not to one stored record. Fix: 'The adapter converts all four vendor payload structures to this schema.' A count of items the sentence never names is the same fault: 'It reports four counts' names none of the four. Fix: name each item, for example 'The summary reports the number of orders read, written, skipped, and failed.' Fault: 'Mode' substitutes for the difference between two payloads: 'The router sends an order in one of two modes: on the primary queue, with a priority flag, or on a queue of its own.' 'Mode' names no field, no request, and no response a reader can check the sentence against. Fix: 'The router sends an order to the primary queue with a priority flag set, or to a queue of its own.' Unconditional on document type: it fires on every type, because a reader of any document checks its sentences against the system they describe. Scope: on a PR Description, the sections headed Summary, Problem, or Change, or, in a description with no headings, the sentences that state what was wrong before the change and what the change does; on every other type, the whole document. Judge in two steps: first find each abstract noun, structural noun, or unnamed count in that scope; then ask which file, type, schema, field, record, request, or item it refers to. Report a finding only where the answer names a concrete artefact the sentence does not. Not this fault: a noun where the thing named is itself abstract, such as a measured quantity a tool reports, for example 'Line coverage of the parser rose from 71% to 84%.'; a structural noun in its literal sense, such as 'an HTML form', 'a CSS grid layout', 'pod placement' in a cluster scheduler, or a named thing's own layout a reader can inspect directly ('the repository layout', a document's own layout of sections, SPEC §8.3); a heading or a section name such as 'Context'; a document type name such as 'Evidence List'; a code span or a literal token (SPEC §6.2); on a PR Description, a sentence outside the problem statement and the change statement. Not a banned-word entry: each noun has a correct abstract use, and a word-list lookup reads one token, not the document the token is in. Distinct from no-metaphor-or-analogy (SPEC §5.5): where the sentence names the schema, type, API, or contract, and a form noun stands in for its fields, values, or operations, report it under no-metaphor-or-analogy only; where the sentence names no artefact for the noun to belong to, report it under this rule only. Distinct from no-mechanism-for-outcome (SPEC §7.13): that rule cuts an implementation unit a reader's task does not act on, while this rule asks for the artefact a reader checks a sentence against, which a reader's task does act on. Judge against the whole document, read end to end, not only the lines an earlier pass flagged: a clean deterministic-tier result does not show this rule passes. Telling an abstract stand-in apart from a correct abstract noun needs judgement, so this stays inference-based."

[[rules]]
id = "no-check-without-result"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
applies_to_document_type = "pr-description"
description = "In a PR Description, each verification entry pairs a check with its result (SPEC §7.16). A check is a command, a test suite, or a manual step. A check listed with no result reads as evidence that the change works, and states no result. Fault: a Verification section whose entries are '`make test`' and '`ruff check .`' alone. Fix: '`make test`: passed, 212 tests' and '`ruff check .`: no findings'. Fault: 'Tested locally.', which names no check and no result. Fix: name the check and what it showed, for example 'Ran the importer against `fixtures/ledger.csv`: 1,204 rows written, 0 rejected.' Fault: a ticked checkbox such as '- [x] Tests pass', which names no check. Fix: '`pytest`: passed, 48 tests'. A failing or a partial result is still a result: '`make e2e`: 2 failures, both in `test_retry`, and both also fail on `main`' is not this fault. Conditional on document type: it fires only after document-type-template assigns the type PR Description, and on no other type. Judge in two steps: first find each entry that presents a check as verification, in a section headed Verification, Testing, or Test plan, or in a sentence that states the change was tested; then check whether the entry states what the check returned or showed. Report a finding only where the second step finds no result. Not this fault: an entry in a section that lists what did not run or could not run, headed Not verified or Not tested, for example '`make e2e`: not run, because the suite needs staging credentials.' That section is correct content in a PR Description, and it states a limit plainly. Also not this fault: a command a reviewer is asked to run, in a section headed How to try it or How to reproduce; a command the change adds or alters, named in the Change section; a command followed directly by its pasted output, since the output is the result. Telling a verification entry apart from a command named for another reason needs judgement, so this stays inference-based."

[[rules]]
id = "no-cadence-device"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A cadence device is a sentence written for rhythm that restates a fact the sentence before it already states (SPEC §8.1). It adds no fact, and a reader recognises it as a pattern of text generated by a language model; the rule judges the text, not its author. Two shapes are this fault. First, a verbless fragment set as its own sentence after a longer sentence, to repeat or stress it. Example: 'The consumer retries each failed message three times with exponential backoff, then writes it to the dead-letter topic. No silent drops.' 'No silent drops' has no verb and states nothing the first sentence does not. Fix: delete the fragment. Second, a matched pair: two sentences in the same grammatical shape where the second restates the first. Example: 'The parser reads each file once. It never reads a file twice.' Fix: keep the first sentence only. Test: delete the fragment, or the second sentence of the pair; if a reader loses no fact, it was a cadence device. If the fragment named a fact the sentence before it does not state, the fix is to write that fact as a full sentence with a verb. Judge in two steps: first find a verbless sentence, or two adjacent sentences with matching subject, verb, and object shape; then check whether the flagged sentence states a fact the sentence before it does not. Report a finding only where both steps match. Not this fault: a heading, a list item, a table cell, or a label such as 'Fault:', which is not a sentence; a one-word answer to a direct question in a chat reply, where the question supplies the verb; two sentences in the same shape that state two different facts ('A read takes a shared lock. A write takes an exclusive lock.'); quoted material (SPEC §6.3). Distinct from no-clipped-sentence-run (SPEC §3.6), which covers a run of short sentences that splits one fact into pieces; this rule covers one sentence that repeats a fact already stated in full. Where no-entailed-restatement (SPEC §7.12) would also match and the restatement repeats the shape of the sentence before it, report this rule. A parser can flag a verbless sentence or a repeated shape, but deciding whether the flagged sentence adds a fact needs judgement, so this stays inference-based."

[[rules]]
id = "no-mechanical-repetition"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Repeat a form or a fact only where a reader needs it again (SPEC §8.2). Mechanical repetition adds no fact, and a reader recognises it as a pattern of text generated by a language model; the rule judges the text, not its author. Three patterns are this fault. First, the same formatting on every item: a bold lead-in opens each bullet, across a run of lists, and each lead-in restates the item it labels. Example: '- **Fast startup.** The service starts in 200 ms. - **Low memory.** The service uses 40 MB at idle. - **One config file.** The service reads one TOML file.' Fix: remove the lead-ins and keep the sentences. Second, one fact restated in several places in different words: a measurement given in the summary, again in the body, and again in a closing section ('Cold start takes 200 ms.', 'The service is ready in a fifth of a second.', 'Startup finishes in well under a quarter of a second.'). Fix: state it once, in the section where a reader looks for it; the summary that SPEC §7.1 requires may state it a second time. Third, a contents list out of scale with the document: a document of under about 300 lines takes no contents list; a longer document lists its top-level headings, and lists subsections only where a reader looks one up by number. A contents list of twenty entries on a 250-line document is this fault. Not this fault: a bold lead-in that is the term the item defines or the name of a section the item describes (as in SPEC §2's list of tiers, or a template's list of required sections); a bold lead-in on one list where the items differ in kind and the lead-in names the kind; a value repeated in a code block or a literal token (SPEC §6.2), which a reader copies; a fact stated once in the summary (SPEC §7.1) and once in the body. Report the bold lead-in pattern once per run of lists, not once per bullet. Telling a needed repetition apart from a mechanical one needs judgement, so this stays inference-based, and the false-positive risk keeps it at warning severity."

[[rules]]
id = "no-distributive-tail"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A distributive tail is a clause joined with 'and' to a sentence that states a count or a set, which gives one property to every member with 'each', 'both', or 'every one of them' (SPEC §8.3). The tail is this fault where that property is a fact about the document's own layout, not about the subject matter. It adds no fact about the subject matter, and a reader recognises it as a pattern of text generated by a language model; the rule judges the text, not its author. Two faults at once: the coordination is false, because 'and' joins two clauses of the same kind, and here the main clause states a fact about the system while the tail states a note on the document's structure as though it were a second finding; and the distributed property is a modifier of the noun phrase, written as a clause. Fault: 'Four checks run on upload, and each is a step below.' Fix: write the property as a modifier of the noun phrase, 'Four checks run on upload, described in the steps below.' Fault: 'The service exposes two endpoints, and both are listed in the table.' Fix: 'The service exposes two endpoints, listed in the table.' Correct, not this fault: 'Three consumers read the topic, and each commits its offset independently.' The tail states a fact about the consumers, not about the document; keep it. Judge in two steps: first find a sentence that states a count or a set and then a clause joined with 'and' that opens with 'each', 'both', 'every one of them', or a similar distributive word; then check whether that clause's property is about the document's layout (a step, a section, a table, a list, a position such as 'below') and whether writing it as a modifier of the noun phrase loses a fact. Report a finding only where the property is about the layout and the modifier form loses no fact, and give the modifier form as the fix. Not this fault: a tail whose property is a fact about the subject matter, as in the consumer example; a distributive word in the main clause, with no tail joined by 'and' ('Each of the four checks is a step in §4.'); a separate sentence that states where the document describes the members ('§4 describes each check.'); quoted material (SPEC §6.3). Distinct from no-cadence-device (SPEC §8.1): a cadence device restates a fact the sentence before it already states, as a verbless fragment or a matched pair of sentences; a distributive tail adds a fact about the document, inside the same sentence. Distinct from vacuous-classification-property (SPEC §7.6): a count signpost states only how many items come directly after it; a distributive tail is a clause joined to a count whose main clause states a fact. Where a sentence states only a count of the items after it, report it under vacuous-classification-property only. A parser can find ', and each' or ', and both' after a count, but telling a property of the layout from a property of the subject matter needs judgement, so this stays inference-based."

[[rules]]
id = "no-withholding-heading"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A heading names what its section states (SPEC §7.17). A withholding heading names the section only by what a reader gets from reading it: its meaning, its consequence, its outcome, or a promise that it is notable. A reader must read the section to learn what the heading refers to, and a heading read alone, in a contents list, a link, or a search result, states nothing. Scope: headings only, at every level, the document title included; in body prose the shape forms no sentence. Fault: 'What this means for everything else'. Fix: state the fact the section states, 'Retries are capped at three attempts'. Fault: 'What we found', over a section that reports one measurement. Fix: 'Cold start takes 200 ms'. Fault: 'The surprising part'. Fix: name the fact, 'The parser reads each file twice'. A heading that names a subject but refers to the section only by its meaning is the same fault: 'What the retry cap means for the scheduler'. Unconditional on document type: it fires on every type. Judge in two steps: first read each heading alone, without its section; then check whether it names a fact the section states, or a subject and the property of it the section states (a cost, a content, a limit, an owner, a behaviour). Report a finding only where it names neither, and give the fact as the fix. Not this fault: a heading that names a subject, or a subject and a property ('Retry policy', 'What a session-store entry contains'), since a heading need not be a full sentence; a conventional section name that names the section's function and reads the same in any document of its type ('Summary', 'Context', 'Decision', 'Consequences', 'Recommendation'), including every section name a document type's template lists (SPEC §7.8, Appendix F); a task heading in the imperative or the infinitive ('Install the CLI', 'How to try it'); a heading that is a literal token (SPEC §6.2). A formulaic phrase on the fixed list (vocabulary/banned.tsv, for example 'at a glance', 'the big picture', 'the upshot') is caught by banned-word; this rule covers the wording not on the list. Distinct from no-unanchored-reference (SPEC §7.5): a heading can name its referent and still withhold its content. Where both rules match one heading, report it under this rule only, since the fix states the fact and the fact names the referent. A heading phrased as a direct question is a no-question-or-argument-heading finding (SPEC §7.18), not a finding under this rule. A metaphor in a heading is a no-metaphor-or-analogy finding (SPEC §5.5), and a heading that states what a subject does not do is a no-contrastive-framing finding (SPEC §5.7); this rule judges what a heading names, not how it words it. Telling a withholding heading apart from a heading that names a subject needs judgement, so this stays inference-based."

[[rules]]
id = "no-question-or-argument-heading"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A heading states a claim (SPEC §7.18). It does not ask a question the section then answers, and it does not present a case for a claim. Scope: headings only, at every level, the document title included. Two shapes are this fault. First, a question heading: a direct question, marked by interrogative word order, a question mark, or both. A rhetorical question is the common case; a plain question is the same fault, because the heading asks and only the section states. Fault: 'Why would anyone run it twice?'. Fix: state the answer, 'A second run reuses the cached result'. Fault: 'Does the cache survive a restart?'. Fix: 'A restart empties the cache'. Second, an argument heading: a heading that announces a case for a claim, not the claim itself. Fault: 'The case for capping retries', 'In defence of a second run'. Fix: state the claim, 'Retries are capped at three attempts', and give the reasons in the section. Unconditional on document type: it fires on every type. Judge in two steps: first find each heading in interrogative word order, ending in a question mark, or announcing a case, a defence, or reasons for something; then check whether it states the claim the section answers with or argues for. Report a finding only where it does not, and give that claim as the fix. Not this fault: an indirect question in statement word order, with no question mark, that names its subject and the property the section states ('What a session-store entry contains', 'How the scheduler orders jobs'), which SPEC §7.5 permits when the heading names its referent; a task heading ('How to try it', 'How to reproduce'); a section name that names questions, such as 'Open questions' in a design document; a heading that is a literal token (SPEC §6.2), or a verbatim quotation (SPEC §6.3) that is the section's subject, such as an error message. Where no-withholding-heading (SPEC §7.17) also matches ('What does this mean for everything else?'), report it under this rule only. Where no-unanchored-reference (SPEC §7.5) also matches, as the bare 'it' in 'Why would anyone run it twice?' does, report it under this rule only, since the fix states the claim and the claim names the subject. A metaphor (no-metaphor-or-analogy, SPEC §5.5) or a contrastive frame (no-contrastive-framing, SPEC §5.7) in the same heading is a separate finding under that rule. Distinct from no-cadence-device (SPEC §8.1), which excludes a heading because a heading is not a sentence. A parser can flag a heading that ends in a question mark, but deciding whether it is a question the section answers, a quoted literal, or a case for a claim needs judgement, so this stays inference-based."

[[rules]]
id = "no-unstated-presupposition"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A definite noun phrase presupposes a fact, and the document states that fact before the phrase (SPEC §7.19). 'The four surveyed carriers' presupposes that a survey took place and that it covered four carriers. A phrase that presupposes a fact the document never states is a fault: a reader can tell what kind of thing the noun names, but not which ones, or what happened to them. Either of two markers identifies it. First, a cardinal inside the phrase, a number word or a numeral ('the four carriers', 'the three tables', 'both options'), where no earlier sentence states that count. Second, a past participle inside the phrase that names a completed act ('surveyed', 'rejected', 'agreed', 'measured', 'approved'), where no earlier sentence states that the act took place, who performed it, or what it covered. Fault, as the first sentence of a document: 'The four surveyed carriers all reject a weekend dispatch slot.' No sentence states which four carriers, who surveyed them, or when. Fix: state the fact before the phrase that refers to it: 'The dispatch team surveyed four carriers in March 2026: A, B, C, and D. None accepts a weekend dispatch slot.' The same phrase is correct once the document states the fact: after that first sentence, 'the four surveyed carriers' is anchored, and so is 'the four tables' in a document that lists four tables. Judge in two steps: first find each definite noun phrase ('the', 'these', 'those', 'both', or a possessive, followed by a noun) that contains a cardinal or a completed-act participle; then read the document before the phrase, and check for a sentence that states the count, or states the act and what it covered. Report a finding only where no such sentence exists, and give the missing fact as the fix. Scope: body prose and headings, on every document type; a heading is anchored when the document states the fact before the heading. Not this fault: a phrase that points to where the document states the fact ('the four carriers listed in §3'); a cardinal whose items the same sentence names ('the three routes: read, write, and delete'), so long as the count matches that list; a cardinal that is part of a name or a literal token ('two-phase commit', 'the 404 response'); a number that is a quantity, not a count of referents ('the 30-second timeout'); a participle that names a state or a kind, not a completed act ('the closed connection', 'the compiled binary'), or a declared status value (SPEC §5.8); an act the document type itself records, such as 'the changed files' in a PR Description, whose subject is the change; quoted material (SPEC §6.3) or a literal token (SPEC §6.2). Distinct from no-unanchored-reference (SPEC §7.5): that rule asks for an earlier noun for an abstract singular ('the design', 'the plan'); this rule asks for an earlier statement of a fact, and the noun can be concrete and plural. Where both rules match one phrase, as 'the agreed plan' does in a document that defines no plan, report it under this rule only, since the fix states the agreement and names the plan. Distinct from no-abstract-stand-in-for-artefact (SPEC §7.15): where the head noun is abstract and names none of the items it counts ('It reports four counts'), report it under that rule only; where the head noun names a concrete kind ('carriers') and only the count or the act is unstated, report it under this rule only. Distinct from vacuous-classification-property (SPEC §7.6): a count signpost states a count the items directly after it already show; this fault states a count no earlier sentence supports. Distinct from no-count-list-mismatch (SPEC §7.20): a cardinal whose items the same sentence names is correctly not this fault only while the count matches that list; where the count differs from its own list, report it under no-count-list-mismatch only, since the fault there is a wrong count, not an unstated one. Distinct from no-process-narration (SPEC §7.7): fix by stating the fact the phrase depends on and its result, not the history of the work; a fix that adds who asked or what was discussed is a no-process-narration finding. Not a banned-word entry, because each phrase is correct once the document states the fact. A parser can find a cardinal or a participle inside a definite phrase, but whether an earlier sentence states the fact needs the whole document, not a lookup, so this stays inference-based."

[[rules]]
id = "no-count-list-mismatch"
tier = "inference-based"
check = "model-judgement"
severity = "error"
description = "A count in a sentence matches the number of items the same sentence lists after it, after a colon or as an and/or list (SPEC §7.20). A count that differs from its own list states a false fact: a reader who counts the list finds a number other than the one the sentence stated. The same fault also covers a list whose punctuation does not let a reader tell how many items it has, so a reader cannot check the count against it at all. Fault: 'The router sends an order in one of two modes: on the primary queue, with a priority flag, or on a queue of its own.' Two readings of the list differ from the stated count of two: read as three comma-separated items, the list has three, not two; read as two items where 'with a priority flag' modifies the first, the comma that separates the items is indistinguishable, on the page, from the comma that sets off the modifier inside the first item. Either way, a reader cannot check 'one of two' against the list that follows it. Fix: delete the count rather than correct it, and state the cases directly: 'The router sends an order to the primary queue with a priority flag set, or to a queue of its own.' A corrected count that still only announces the list below it, such as 'two ways:' followed by a two-item list, is a vacuous-classification-property count signpost, not this fault. Test: count the items in the list. Where a comma could separate two items or set off a modifier inside one item, the sentence has this fault even where the stated count matches one of the two readings. Not this fault: a number that is a quantity, not a count of the items ('state the result in one or two lines: what ran, and what it found'); a colon that introduces an explanation, not a list ('on both flags: a pending rule is never a finding'); a part of a larger set whose count matches its part ('Two of the five routes drop an entry: read and write.'); quoted material (SPEC §6.3) or a literal token (SPEC §6.2). Distinct from vacuous-classification-property (SPEC §7.6): a count signpost states a count its list already shows, correctly, and adds no fact; this rule's fault is a count that states a fact its list contradicts. Distinct from no-unstated-presupposition (SPEC §7.19): a cardinal whose items the same sentence names is not a §7.19 fault so long as the count matches the list; where the count differs from the list, report it under this rule only. A mismatch states a wrong fact, so this rule runs at error severity, unlike most rules in SPEC §7. Splitting the list needs judgement: a comma can separate two items or set off a modifier inside one, as the example's two readings show, so a regular grammar cannot decide this rule on its own, and it stays inference-based."

[[rules]]
id = "summary-before-detail"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A document opens with a summary before any detail (SPEC §7.1). The summary is one sentence or one short paragraph, and it states the document's main fact: the decision, the description of its subject, or the result. It is the first paragraph before the first section heading, or the first paragraph of a first section headed Summary, Abstract, Overview, or Introduction. A title, a status line, a metadata block, or a contents list before it is front matter, not detail. Scope: the whole document, read end to end; report a finding at line 1. Unconditional on document type: it fires on every type. Two faults. No summary: the document opens with detail, such as a Design document whose first section, 'Context and scope', describes the current order pipeline for three paragraphs, and whose design first appears in its fourth section. Fix: add a paragraph before the first section heading that states the decision, for example 'The order router sends each order to one of three regional queues, chosen by the delivery postcode.' A summary that names only the subject: an opening paragraph that states what the document covers and no fact about it, such as 'This document describes the retry policy for the order consumer.' Fix: state the policy, 'The order consumer retries each failed message three times with exponential backoff, then writes it to the dead-letter topic.' Test: read the summary alone; if a reader cannot state the document's main fact from it, the document has this fault. Judge in two steps: first find the summary by its position; then check whether it states the document's main fact. Report a finding only where no summary exists, or where the summary states no main fact. Not this fault: a document whose type template (SPEC §7.8, Appendix F) puts another section first, where the title or a required opening section states the main fact, such as an ADR whose title names the decision or an RFC whose Abstract states it; an entry in a Lab Notebook or a Portfolio Journal, whose template fixes the order of each entry's parts; a document of one paragraph, which is its own summary. Other rules exempt the summary this rule requires: a count the body expands in separate sections is not a vacuous-classification-property count signpost (SPEC §7.6), and a fact stated once in the summary and once in the body is not a no-mechanical-repetition finding (SPEC §8.2). Distinct from no-process-narration (SPEC §7.7): an opening paragraph that narrates how the decision was reached is not a summary; report the narration under no-process-narration, and report this rule at line 1 where no summary states the main fact. Distinct from no-precedent-before-subject (SPEC §7.22), which asks for the same order inside one section. A parser can find the text before the first heading, or a heading named Summary, but whether that text states the document's main fact needs judgement, so this stays inference-based."

[[rules]]
id = "no-contradiction-between-sections"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A document states one version of each fact (SPEC §7.21). Scope: the whole document, read end to end. Unconditional on document type: it fires on every type. Two faults. Contradiction: a later section, such as a decision record, a discussion point, an amendment, or a changelog entry, states a fact that an earlier section contradicts, so the two statements cannot both be true of the same thing, and a reader cannot tell which one is current. Stale status marker: a later entry states that a decision is agreed but not yet applied to the body ('agreed, not yet reflected above', 'not yet reflected below'); the marker states that the body is out of date, and the body stays out of date. Fault: §3 states 'Every queue has at least one consumer, so the router never checks for an empty queue.', and §9, decision Q-4, states 'Status: agreed, not yet reflected above. A queue can have zero consumers; the router checks before it sends.' Report two findings: §3's sentence, at its own line, as contradicted by Q-4; and Q-4's status marker, at its own line, as stale. Fix: apply the decision to the body and delete the marker, so §3 states 'A queue can have zero consumers, so the router checks for an empty queue before it sends.' Q-4 can stay as a record of the decision once the body states the same fact. Judge in two steps: first find each fact a later section states about a thing an earlier section also describes, and each status marker that states a decision is not yet applied; then check whether each such fact and the earlier sentence can both be true, and whether the later section names itself as an exception. Report a contradiction at the earlier sentence, naming the later section; report a status marker at its own line. Not this fault: a later section that states an exception to an earlier rule and names it as one ('The audit queue is an exception to §3: it has no consumer.'); an open question that states no decision, in a Design or an API Design document (SPEC §7.9); an alternative in a section headed Alternatives considered, stated as rejected; a history or changelog entry that names an earlier fact as replaced, where the body states the current fact ('Version 2 replaced the per-queue lock with one global lock', where the body describes the global lock); a Lab Notebook entry that corrects an earlier entry, since its template keeps the earlier entry unchanged and records the correction beside it (SPEC Appendix F); two statements about different things, or about one thing under different conditions ('A read takes a shared lock.' and 'A write takes an exclusive lock.'); quoted material (SPEC §6.3). Distinct from no-count-list-mismatch (SPEC §7.20): a count that differs from its own list, inside one sentence, is a finding under that rule only. Distinct from no-mechanical-repetition (SPEC §8.2): that rule covers one fact restated with the same value; where a restatement states a different value ('Cold start takes 200 ms.' in the summary, 'Cold start takes 350 ms.' in the results), report it under this rule only, since the fix keeps one value. Distinct from no-process-narration (SPEC §7.7): where a status marker also narrates the discussion ('agreed at the review on 3 March, not yet reflected above'), report it under this rule only, since the fix deletes the marker; a fix that adds who asked or what was discussed is a no-process-narration finding. Distinct from no-planning-content-in-reference (SPEC §7.9): in a Reference document, a stale status marker is also planning content; report it under this rule only. Two statements that cannot both be true include a false fact, as a no-count-list-mismatch finding does, but this rule runs at warning severity, unlike SPEC §7.20: that fault is inside one sentence, and counting the list checks it, while this fault spans sections, and telling a contradiction apart from a scoped rule, a named exception, or a recorded history needs a model of each statement's scope. A parser can find a status marker by its wording, but whether two statements in different sections contradict each other needs judgement, so this stays inference-based."

[[rules]]
id = "no-precedent-before-subject"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A section states its own subject's facts first (SPEC §7.22). A section whose heading names one subject is this fault when two or more paragraphs or lists about a different component, system, or precedent precede the first fact about its own subject. A reader who opens the section for its subject reads about another thing first, and cannot tell which facts are the subject's until the subject appears. Scope: the whole document, one section at a time; report a finding at the section heading's line. Unconditional on document type: it fires on every type. Fault, under the heading 'Order consumer retry policy': two paragraphs on the billing service ('The billing service retries a failed charge five times, with a fixed 10-second delay. It writes each final failure to a dead-letter table, and an operator replays the table each morning.' and 'The billing policy dates from 2023. During a payment provider outage in March 2025, its fixed delay sent a burst of retries to the provider.') precede 'The order consumer retries each failed message three times, with exponential backoff from one second, then writes it to the dead-letter topic.' Fix: state the subject's facts first; then put the part of the precedent the section needs after them, or cut it: 'The order consumer retries each failed message three times, with exponential backoff from one second, then writes it to the dead-letter topic. The billing service retries with a fixed 10-second delay. During a payment provider outage in March 2025, that delay sent a burst of retries to the provider.' Judge in two steps: first name the subject the section's heading names, and find the first sentence that states a fact about it; then count the paragraphs and lists before that sentence that describe another component, system, or precedent. Report a finding only where two or more precede it. Not this fault: one paragraph or less of context before the subject's facts, such as a sentence that names the system the subject is part of; a section whose heading names the other thing or the comparison ('Prior art', 'Alternatives considered', 'Comparison with the billing service'); a section whose type template makes context its purpose, such as a Design document's 'Context and scope' or an ADR's 'Context' (SPEC Appendix F); a description of another component after the subject's own facts; a section whose subject is the precedent. Distinct from no-out-of-scope-comparand (SPEC §7.10): where the reader's task does not need the precedent at all, report it under that rule only, since the fix cuts it; this rule's fix keeps a precedent the task needs, after the subject's facts. Distinct from summary-before-detail (SPEC §7.1), the same order for the whole document: where both match the opening of a document, report each. Distinct from no-metaphor-or-analogy (SPEC §5.5): where the precedent is a comparison that explains the subject ('the order consumer retries the way the billing service does'), report it under that rule only; this rule covers a literal description of another thing. Distinct from no-process-narration (SPEC §7.7): where the precedent is the history of how the decision was reached ('the team first tried the billing service's policy'), report it under that rule only. Distinct from SPEC §3.3: that rule covers one paragraph with more than one topic; this rule covers paragraphs that each keep to one topic, in the wrong order. A parser can find a section's heading and its paragraphs, but deciding which subject each paragraph describes needs judgement, so this stays inference-based."

[[rules]]
id = "no-reader-reaction-prediction"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
trigger_phrases = [
  "it helps to", "it pays to", "you may want to", "you will want to",
  "you will find", "before you find out", "be glad",
]
description = "A sentence states a fact about its subject, or gives an instruction (SPEC §5.3). It does not predict how a reader will react, what a reader will prefer, or what a reader will find out, and it does not advise a reader with no stated consequence. Such a sentence states no fact about the system, or states its one fact only inside the prediction. Three shapes are this fault. First, a prediction with no fact. Fault: 'That may be exactly what you want.' Fault: 'Most teams find the default region is enough.' Fix: state the fact the prediction rests on, 'The default region is eu-west-2, and every service in this guide runs in it.', or delete the sentence. Second, advice with no consequence. Fault: 'It helps to keep a terminal open as you go.' Fix: state the consequence, 'Keep a terminal open: steps 3 to 5 each run a command in it.', or delete the sentence where no consequence exists. Third, a fact inside a prediction. Fault: 'Choose the region carefully now, before you find out after the first deploy.' The fact, that a deploy cannot change the region, is stated only as something a reader finds out. Fix: 'Choose the region before the first deploy: a deploy cannot change it later.' Test: delete the prediction or the advice frame; if a fact about the subject remains, state it as a plain clause or as a consequence of the action; if none remains, delete the sentence. Judge in two steps: first find each sentence whose main clause has a reader, or a group a reader belongs to ('you', 'a reader', 'users', 'most teams'), as the subject of a verb of reaction, preference, discovery, or experience ('find', 'find out', 'want', 'prefer', 'like', 'be glad', 'thank', 'appreciate', 'regret'), and each sentence whose main clause is an advice frame with no subject in the system ('it helps to', 'it pays to', 'you may want to', 'it is a good idea to'); then check whether the sentence states, outside the prediction or the frame, a consequence or a fact a reader can check. Report a finding only where it states none, and give the fact or the consequence as the fix, or delete the sentence. Not this fault: a sentence that states a consequence of an action ('If you skip this step, the first deploy fails.'); an instruction ('Open a terminal.'), including a conditional imperative in a How-to guide ('If you want a dry run, pass --check.'), where the condition names a goal and the instruction names the action (SPEC §4.4, §4.5, Appendix F); in a Tutorial, a statement of what a learner sees after a step ('The command prints three lines.'), since that is an observable result; a requirement on a reader's input ('You need an API key with write access.'); quoted material (SPEC §6.3) or a literal token (SPEC §6.2). The fixed phrases in vocabulary/banned.tsv ('you might', 'you will notice', 'you may find', 'you will be glad', 'before you find out', 'exactly what you want', 'may be what you want') are caught by banned-word: report them under banned-word only; this rule covers the wording not on the list. Distinct from the editorial judgement SPEC §5.3 also names ('the refactor deserves praise'), which judges the subject; this rule covers a prediction about a reader. Distinct from no-framing-device (SPEC §5.10): a framing device wraps a fact in a cleft, a question, or a name; where a sentence wraps a fact in a prediction ('before you find out'), report it under this rule only. Distinct from no-entailed-restatement (SPEC §7.12): a restatement repeats a fact the text already states; a prediction states none. Distinct from no-remark-about-the-writing (SPEC §5.3): where a prediction names only a later part of the document ('you will see why in the next section'), report it under that rule only. 'it helps to' and 'you may want to' are not banned-word entries: 'it' can name a component, and a consequence can follow in the same sentence, so a flat lookup would report a correct sentence. A parser can find a second-person verb or an advice frame, but whether the sentence states a consequence a reader can check needs judgement, so this stays inference-based."

[[rules]]
id = "no-remark-about-the-writing"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
trigger_phrases = [
  "this is where", "here is where", "that is where", "this is what",
  "that is what", "comes in", "come in", "the next section is for",
]
description = "A sentence states a fact about the system, not about the document it is in (SPEC §5.3). A remark about the writing refers to the document's own sequence, wording, or parts, and states no fact about the subject. One form is a navigational announcement: a sentence that states where the document turns to a subject, or what a part of the document is for. Fault: 'This is where the signing certificate comes in.' Fault: 'Here is where the retry limit matters.' Fault: 'That is what the next section is for.' Fix: delete the sentence, or replace it with the fact the next part starts with, 'The service signs each request with the certificate from step 2.' A paraphrase of a fixed phrase is the same fault: 'to put it briefly' for 'the short version', 'as the last section stated' for 'as noted above'. Test: delete the sentence; if a reader loses no fact about the system, it was a remark about the writing. If it named a subject the next part depends on, state that part's first fact about the subject in its place. Judge in two steps: first find each sentence in body prose whose main clause refers to the document, a part of it, or a position in it ('this is where', 'here is where', 'the next section', 'this part', 'below'), or that announces a subject with 'comes in' or 'matters'; then check whether the sentence states a fact about the system outside that reference. Report a finding only where it states none, and give the fact the next part starts with as the fix, or delete the sentence. Not this fault: a cross-reference that names where a fact is stated ('§4 lists the retry limits', '§4 describes each check'), since a reader can follow it to the fact; a fact with a link to its source ('the client stops after five retries (§4)'); an instruction to go to a part of the document in a How-to guide or a Tutorial ('Go to step 4.'); a heading, which no-withholding-heading (SPEC §7.17) judges; quoted material (SPEC §6.3) or a literal token (SPEC §6.2). The fixed phrases in vocabulary/banned.tsv ('as noted above', 'as mentioned', 'the short version', 'read it as', 'what follows', 'see below', 'comes in', 'come in', and the other entries under its meta-commentary and text-shape headings) are caught by banned-word: report them under banned-word only; this rule covers the wording not on the list. Distinct from no-framing-device (SPEC §5.10): 'that is what the next section is for' has the cleft signature, but its plain clause, 'the next section is for that', still states no fact; report it under this rule only, since the fix deletes the sentence. Distinct from no-reader-reaction-prediction (SPEC §5.3): where a prediction names only a later part of the document ('you will see why in the next section'), report it under this rule only, since the sentence states nothing but the document's sequence. Distinct from no-withholding-heading (SPEC §7.17): that rule covers headings only, and this rule covers body prose only, so the two never judge one line. Distinct from summary-before-detail (SPEC §7.1): an opening paragraph that states only what the document covers is a finding under that rule only. Distinct from vacuous-classification-property (SPEC §7.6): a count signpost ('Three costs follow from that:') is a finding under that rule only. Distinct from no-distributive-tail (SPEC §8.3): a clause about the document's layout joined to a sentence that states a fact is a finding under that rule only; this rule covers a sentence that states no fact at all. 'this is where' and 'here is where' are not banned-word entries: 'this is where the service writes its logs' names a directory, so a flat lookup would report a correct sentence. A parser can find a phrase that refers to the document's sequence, but whether the sentence also states a fact about the system needs judgement, so this stays inference-based."

[exemptions]
skip_line_marker = "<!-- swe: ignore -->"
structural_exclusions = [
  "fenced_code_blocks", "indented_code_blocks", "inline_code_spans",
  "blockquote_lines", "link_targets", "bare_urls", "html_tags",
  "acronyms", "snake_case_or_dotted_or_path_tokens", "camel_case_tokens",
  "version_numbers", "mid_sentence_capitalised_words",
]
