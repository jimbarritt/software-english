# Software English rule catalogue — machine-readable.
# Each entry names a tier ("deterministic" or "inference-based") and a
# severity ("error", blocking, or "warning", advisory-only). See SPEC.md
# §2. Parsed directly by claude-plugins/software-english-lint/scripts/
# software_english_lint.py via Python's stdlib tomllib.

version = "0.1"

[[rules]]
id = "vocabulary-membership"
tier = "deterministic"
check = "vocabulary"
severity = "warning"
description = "Every word outside a literal token (SPEC §6.3) must appear in the approved vocabulary (operations, structure, qualities, connectives). Runs at warning severity while the vocabulary is a seed set — see §6.1 — so an unlisted but valid word does not block a turn."
sources = [
  "vocabulary/operations.tsv",
  "vocabulary/structure.tsv",
  "vocabulary/qualities.tsv",
  "vocabulary/connectives.tsv",
]

[[rules]]
id = "banned-word"
tier = "deterministic"
check = "substitution"
severity = "error"
description = "A word or phrase in the banned list must be replaced with its approved fix, or cut where the fix is CUT."
sources = ["vocabulary/banned.tsv"]

[[rules]]
id = "no-em-dash"
tier = "deterministic"
check = "character-ban"
severity = "error"
character = "—"
description = "Do not use an em dash (SPEC §3.5), in a sentence or in a list item. Unconditional: no exception for a use that reads correctly, the same precedent as a flat vocabulary/banned.tsv entry."

[[rules]]
id = "sentence-length"
tier = "inference-based"
check = "sentence-length"
severity = "warning"
max_words = 20
description = "A sentence must not exceed the configured word limit (SPEC §3, §10). Inference-based because judging whether a long sentence should split, versus is one irreducible fact, needs context; the word count itself is a deterministic-checkable number, but the rule's intent is advisory. The limit is a ceiling, not a target: do not meet it by splitting one fact into a run of clipped sentences (no-clipped-sentence-run, SPEC §3.6)."

[[rules]]
id = "no-clipped-sentence-run"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Vary sentence length, and keep one fact in one sentence where it fits (SPEC §3.6). A run of three or more consecutive short sentences in one paragraph is a fault when the run splits one fact into clipped pieces and a chain of pronouns ('it', 'its', 'their', 'this') joins the pieces back together. The rhythm is staccato, and a pronoun that changes referent from one sentence to the next makes a reader resolve each one again. The 20-word limit (sentence-length, SPEC §3.2) is a ceiling, not a target, and it pushes writing toward this shape: do not meet the limit by splitting one fact into several clipped sentences. One fact takes one sentence, up to the limit; a short fact takes a short sentence. Example: 'That design defines two events on two topics. Its Processing section states them. Their contract is below. It states the payload of each, the topic and message key of each, and the AVRO schema of each. It also states where each is registered.' Four of the five sentences are under ten words, and together they state one fact: what the design defines, and where. 'Their contract is below' states no fact of its own. 'Its', 'Their', 'It', 'It' refer in turn to the design, the events, and the contract, so the referent changes between consecutive sentences. Fix: merge the pieces of one fact into sentences of different lengths, and name the noun wherever a pronoun's referent would change: 'The design defines two events in its Processing section, each on its own topic. For each event, the contract below specifies the payload, the topic, the message key, and the AVRO schema. The contract also records where each schema is registered.' Judge in two steps: first find a run of three or more consecutive sentences in one paragraph, most of them under about ten words; then check the run for a split fact: a sentence that states no complete fact alone, or a sentence after the first whose subject is a pronoun or a possessive pointing back into the run, especially one whose referent differs from the pronoun before it. Report a finding only where both steps match. Not this fault: a run of short sentences that each state a separate, complete fact with a named subject; a list item (SPEC §3.4), which is short by design; a numbered sequence of steps in a Tutorial or a How-to guide (SPEC §7.8). Fix by merging, not by padding: a merged sentence adds no word that states no fact (SPEC §5.4, §7.12), and still obeys sentence-length and one fact per sentence (SPEC §3.1), since the fields of one contract are one fact. Telling one fact split across sentences apart from several facts stated in turn needs judgement, so this stays inference-based."

[[rules]]
id = "no-continuous-tense"
tier = "deterministic"
check = "tense-pattern"
severity = "error"
pattern = '\b(is|are|was|were)\s+([A-Za-z]+ing)\b(?!-)'
stoplist = [
  "during", "nothing", "something", "anything", "everything", "morning",
  "evening", "spring", "king", "thing", "string", "ring",
]
description = 'Do not describe system behaviour in the continuous tense. Example fault: "the consumer is testing the connection". The stoplist excludes matches where the "-ing" word is not a verb, and a following hyphen excludes a compound adjective ("learning-oriented").'

[[rules]]
id = "no-perfect-tense-for-behaviour"
tier = "inference-based"
check = "tense-pattern"
severity = "warning"
pattern = '\b(has|have|had)\s+([A-Za-z]+(?:ed|en))\b'
stoplist = ["ten", "seven", "often", "even", "open", "golden", "chicken", "broken"]
description = "Avoid the perfect tense for behaviour, except to state a historical fact simple past cannot (SPEC §4). Inference-based because telling the two apart needs judgement — this runs advisory-only, never blocking."

[[rules]]
id = "anthropomorphism-fixed-list"
tier = "deterministic"
check = "anthropomorphism"
severity = "error"
lookback_words = 4
subject_signal = ["a word from vocabulary/structure.tsv", "it", "this", "that"]
word_list = [
  "wants", "tries", "knows", "believes", "decides", "gives up",
  "waits patiently", "gets confused", "has patience", "is happy",
  "is confused", "is smart", "understands", "thinks", "remembers",
  "forgets", "hopes", "assumes", "agrees", "refuses", "prefers", "cares",
  "worries", "struggles", "learns", "notices", "realizes", "realises",
  "expects", "intends", "plans", "chooses", "likes", "dislikes",
  "enjoys", "hates",
]
description = 'A system, service, component, or process has no human trait, feeling, or intent (SPEC §5.1). Fires only when a structure noun or a system-referring pronoun appears within lookback_words before the match, to avoid flagging a human subject. "user" is excluded from the subject gate — it names a human referent, not a system one, despite living in structure.tsv for other reasons.'

[[rules]]
id = "abstract-location"
tier = "deterministic"
check = "substitution"
severity = "error"
lookback_words = 4
subject_signal = ['a word from vocabulary/structure.tsv, excluding human referents (e.g. "user")', "it", "this", "that"]
word_list = [
  "sit", "sits", "sitting", "live", "lives", "lived", "living",
  "reside", "resides", "resided", "dwell", "dwells", "dwelled",
  "stand", "stands", "stood", "lie", "lies", "lay", "rest", "rests",
  "rested", "hang", "hangs", "hung", "float", "floats", "floated",
]
description = 'A location or motion verb ("sits", "lives", "resides") standing in for a plain classification verb ("is", "belongs to") when the subject is abstract, not physical — the same fault as "reach" or "carry" in banned.tsv, but not blockable as a flat banned word, because each of these verbs is correct English for a physical or human subject ("the operator sits at the console"). Gated the same way as anthropomorphism-fixed-list, and for the same reason: this fault is a default of fluent English, not a vocabulary gap — a writer actively avoiding it can still produce it without noticing. A motion verb with the same fault that also names a literal operation on a structure noun ("does not move", "pass over", "goes past") is not on this list, because the subject gate cannot tell "the schema does not move" from "the file does not move". no-metaphor-or-analogy covers it at the inference tier.'

[[rules]]
id = "anthropomorphism-paraphrase"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A paraphrase of the anthropomorphism fault not on the fixed list (SPEC §5.1) — needs a model, not a linter."

[[rules]]
id = "vacuous-classification-property"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
trigger_phrases = [
  "exactly one", "at most one", "mutually exclusive",
  "collectively exhaustive", "no overlap", "one and only one",
]
description = 'A cardinality or exclusivity property (SPEC §7) stated near a taxonomy definition ("defines N tiers/kinds/categories/levels") is a fault when the property already follows from the member definitions and no mechanism reads it. The trigger phrases are deterministically findable; whether a given instance is load-bearing needs judgement, so this stays inference-based.'

[[rules]]
id = "no-unanchored-reference"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = 'A definite reference ("the design", "the decision", "the plan", "this change", and similar) with no antecedent inside the document (SPEC §7.5) — a reader without the context the writer had cannot resolve it. Not a banned-word entry, because each phrase is correct when the document defines its referent. Whether an antecedent exists needs the whole document, not a lookup, so this stays inference-based.'

[[rules]]
id = "no-process-narration"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A document about a decision states the decision and the reason for it (SPEC §7.7). It does not narrate how the decision was reached: who asked, what was discussed, how many attempts came before it, or what changed between drafts. Recognising process narration versus a stated fact needs judgement, so this stays inference-based."

[[rules]]
id = "document-type-template"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Identify a document's target type (RFC, ADR, Design, API Design, Specification, Technical Manual, and similar — SPEC §7.8) before writing it. A type governs structure and required sections beyond Software English's own sentence-level rules. See SPEC Appendix F and templates/ for a by-reference local summary of each type's canonical structure — Software English does not redefine these structures itself. Tell Design and Reference apart before judging either: a Design document states a design that is chosen and not yet built, so it holds what exists, what is decided, and what is still open, all at once, while a Reference document describes a system that already exists. Decision state separates the neighbouring types: an ADR records one decision already taken, an RFC proposes one for an answer, a Design document holds many, some still open. API Design is a specialisation of Design (SPEC Appendix F, templates/api-design.md). It keeps Design's seven sections, with API-specific content added. Treat it as Design for every other rule conditioned on document type. Recognising which type a document should follow needs judgement, so this stays inference-based."

[[rules]]
id = "no-planning-content-in-reference"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
applies_to_document_type = "reference"
description = "A document of Diátaxis type Reference (SPEC §7.9) contains no planning or task-oriented content: no open question, no next step, no statement of who does work or when, no pointer to a plan document, and no statement of the document's own purpose relative to a task in progress. A sentence that states where planning content belongs is itself planning content. Conditional on document type: it fires only after document-type-template assigns the type Reference, because the same content is correct in a plan, an RFC, or an ADR. It never fires on a Design document, or on an API Design document, a specialisation of Design. Both are named in SPEC Appendix F, templates/design.md and templates/api-design.md. Both contain an open-questions section and a future-extension section as correct content. The Design exemption covers those two kinds of content only. A work-breakdown sentence, or an issue-tracker id used as the pointer to later work, is a fault on every document type, Reference included. Report it under no-work-breakdown-or-tracker-pointer (SPEC §7.14), not under this rule. Check the type before reporting any finding under this rule, because a design document typed as Reference by mistake reports one against every entry in both sections. Software English's own addition, reasoned from Diátaxis's 'describe, and only describe' guidance, which names no such category. Recognising planning content needs judgement, so this stays inference-based."

[[rules]]
id = "no-work-breakdown-or-tracker-pointer"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A document does not divide its subject into units of work, and does not point to later work by an issue-tracker id (SPEC §7.14). Two faults. Work-breakdown narrative: a sentence that states which part of the subject one unit of work covers (this piece of work, this change, this phase, this ticket) and which part a later unit covers (a later piece of work, a follow-up, phase two). That is a scheduling choice, not a fact about the subject. Issue-tracker pointer: an issue or pull-request id ('PROJ-142', '#42', 'repo#slug') given as the pointer to work the document does not itself state. The id names no fact inside the document, and it stops resolving once the tracker is migrated, renamed, or closed. Fault: 'This piece of work covers the read path. The write path follows in a later piece of work, tracked in PROJ-142.' Fix: state the boundary as a fact of the subject, with no unit of work and no id: 'A write path: the order store accepts writes through the same schema.' Unconditional on document type: it fires on every type, Design, API Design, RFC and ADR included, because neither fault states a fact about the subject in any of them. Judge in two steps: first find each sentence that names a unit of work or an issue-tracker id; then check whether the sentence divides the subject between units of work, or uses the id in place of a stated fact about later work. Report a finding only where the second step matches. Test: remove the unit of work and the id; keep any fact about the subject that remains, and delete the sentence if none remains. Not this fault: an entry in a section headed References, Normative References, Informative References, or Bibliography, citing an issue or a pull request by its id and its title, as a source; an open question or a future extension in a Design or API Design document that names no unit of work and no id, since SPEC §7.9 governs those by type and exempts them; a Lab Notebook entry naming the task it belongs to, or a Portfolio Journal entry recording work already done, since neither points to later work. Distinct from no-planning-content-in-reference (SPEC §7.9): that rule covers every kind of planning content, in a Reference document only. This rule covers two kinds, in every document, and takes precedence: report a work-breakdown sentence or a tracker pointer under this rule only, never under both. Distinct from no-unanchored-reference (SPEC §7.5): the id can resolve and still be this fault. Telling a unit of work apart from a part of the subject needs judgement, so this stays inference-based."

[[rules]]
id = "no-metaphor-or-analogy"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "State a fact or a mechanism directly (SPEC §5.5). Do not explain it through a comparison to something else (a metaphor or an analogy, e.g. 'the retry queue is the system's safety net'). A formulaic transport metaphor, possession verb, or motion idiom on the fixed list (vocabulary/banned.tsv, for example 'rides on', 'piggyback', 'travels', 'carries', 'holds', 'where this leaves', 'as they come') is caught by banned-word. A system, a structure, or an abstract concept has no hands, so carry and hold are on the fixed list for every subject: 'the response contains the order list', not 'the response holds the order list'. Also watch for an abstract subject (a decision, a contract, a schema, a design, a reader's attention) given a verb of physical motion or position: 'the published schema does not move' (does not change), 'the notice should not go past a reader' (a reader should not miss the notice), 'reject the option rather than pass over it' (omit it), 'renamed behind the serialiser' (renamed without changing the response), 'the design comes from the reference implementation' (is specified in). Each of these verbs is also correct for a literal operation on a structure noun ('the file does not move', 'a second pass over the input', 'the service runs behind the proxy'), so only judgement can tell the two apart. Also watch for a container-and-form noun (shape, layer, space) applied to a schema, a type, an API, or a contract in place of the fields, values, or operations it defines: 'a version fixed now would name a shape the schema does not have' (would refer to fields the schema does not contain), 'the contract is a thin layer over the table' (the contract has the same fields as the table), 'the type leaves no space for a null' (the type does not accept a null). The noun 'surface' ('the API surface') is on the fixed list and is caught by banned-word. Each of these nouns also has a literal use: 'the schema contains a version field' (a schema containing a field is literal; the fault is the form noun, not the verb contain), 'the error shape as a type' where the type then lists the fields, 'the network layer', 'disk space', so only judgement can tell the two apart. A metaphor or an analogy not on the fixed list needs judgement to recognise, so this stays inference-based."

[[rules]]
id = "honest-self-qualifier-paraphrase"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A paraphrase of the self-qualifying 'honest' fault (SPEC §5.6) not on the fixed list (vocabulary/banned.tsv), for example 'if I'm honest, the design needs a rethink'. 'Honest' also names a real, checkable property (an honest mistake, an honest broker) — telling that use apart from the self-qualifier use needs judgement, so this stays inference-based."

[[rules]]
id = "no-contrastive-framing"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A sentence states what happens (SPEC §5.7). It does not state what does not happen, what a component cannot do, or how a case differs from one the reader has not asked about, since that answers an objection instead of the question. Marker words (\"the one exception\", \"cannot\", \"still\", \"the difference is\", \"not that\", \"unlike\") are not faults by themselves: \"cannot\" states a real, load-bearing limit as plainly as any other fact in a reference document. The fault is the sentence's shape, not any one word, so telling a defensive frame apart from a plain stated limit needs judgement."

[[rules]]
id = "no-undeclared-state-verb"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "Where a document declares an explicit status set for an entity (an enum, a union type, a table of states, or a list of status values), a sentence about a state change of that entity names a declared value (SPEC §5.8). A verb that names no declared status is a fault. Example: 'when a sync settles', where the document declares the sync status set as pending, in_progress, failed, completed, and completed_with_errors, and no status is settled. Fix: name the declared status ('when the sync status changes to completed'), or list each status the verb covers. Judge in two steps: first find every declared status set in the document and the entity it belongs to; then check each verb whose subject is that entity, or one of its instances, and that describes a change of its state. Not this fault: a verb form of a declared value ('the sync fails' for failed, 'the sync completes' for completed); a verb about an entity with no declared status set; a verb that names an action, not a state change ('the sync reads the ledger'). Distinct from anthropomorphism-paraphrase: the verb gives the system no human trait. Distinct from no-metaphor-or-analogy: the verb need not be a metaphor; a plain verb such as 'finishes' or 'ends' has the same fault when it covers more than one declared status and names none. Distinct from SPEC §7.4's define-before-use: defining the verb would add a second name for states the document already names, which is the fault itself. Finding the status set needs comprehension of the document, not a lookup, and linking a verb to the entity whose status it changes needs judgement, so this stays inference-based."

[[rules]]
id = "no-catch-all-verb"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "One verb names one relation within a paragraph (SPEC §5.9). A content verb used more than once in one paragraph is a fault when its occurrences name different relations: one general verb stands in for several precise ones, and a reader cannot tell the relations apart. Example: 'That design defines two events on two topics. Its Processing section states them. Their contract is below. It states the payload of each, the topic and message key of each, and the AVRO schema of each. It also states where each is registered.' Here 'states' names three relations: a section that lists the events, a contract that specifies each field, and a contract that records where each schema is registered. Fix: name each relation, and use a distinct verb for each: 'The design defines two events in its Processing section, each on its own topic. For each event, the contract below specifies the payload, the topic, the message key, and the AVRO schema. The contract also records where each schema is registered.' Judge in two steps: first find each content verb that occurs more than once in one paragraph, ignoring an auxiliary or a copula (is, are, has, have, does, can, will); then state, for each occurrence, the relation it names between its subject and its object. Report a finding only where two occurrences name different relations, and name the precise verb for each. Not this fault: a verb repeated with the same relation each time ('each handler returns an error', or a list where each entry 'contains' its fields), since there the same verb is correct and a synonym would suggest a second relation; a term the document defines, which keeps its one name (SPEC §6.1); a repetition in a code span or a blockquote (SPEC §6.2, §6.3). Fix by naming the relation, not by cycling synonyms. Distinct from no-undeclared-state-verb: the verb need not describe a state change, and the document need not declare a status set. Distinct from no-metaphor-or-analogy: the verb is literal, only too general. Naming the relation each occurrence states needs comprehension, so this stays inference-based."

[[rules]]
id = "no-out-of-scope-comparand"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A reader-facing document names only what the reader's task needs (SPEC §7.10). A comparison to another artefact outside that task is a fault even when stated plainly, with no contrastive framing (§5.7), when the reader has no reason to know the other artefact. Distinct from §7.5's no-unanchored-reference: the reference can resolve fine (a working link); the fault is that the reader's task never needed it. Recognising what a reader's task needs, as against what the writer's own working context happened to include, needs judgement, so this stays inference-based."

[[rules]]
id = "no-entailed-restatement"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A clause that follows from a fact stated in the same sentence or the one before it, given what the intended reader already knows, adds nothing (SPEC §7.12). Cut it; keep the fact it derives from. Sibling of §7.6, which covers the same fault inside a taxonomy definition specifically; this is the general case. Not this fault: a clause naming a distinct consequence, not a rephrase; a Tutorial-type document (§7.8), where restating a fact for a learner is the genre's purpose. High false-positive risk, since the test rests on a model of reader knowledge: runs at warning severity, never error."

[[rules]]
id = "no-mechanism-for-outcome"
tier = "inference-based"
check = "model-judgement"
severity = "warning"
description = "A reader-facing sentence states an outcome at the level the reader acts on (SPEC §7.13). It names an implementation unit (a hook, a handler, a count of components) only where the reader's task acts on that unit. Test: change the mechanism and keep the outcome; if the sentence's use to the reader does not change, the mechanism was at the wrong level. Distinct from §7.4's define-before-use: an undefined term is a symptom here, not the fault, and defining it would not fix the sentence."

[exemptions]
skip_line_marker = "<!-- swe: ignore -->"
structural_exclusions = [
  "fenced_code_blocks", "indented_code_blocks", "inline_code_spans",
  "blockquote_lines", "link_targets", "bare_urls", "html_tags",
  "acronyms", "snake_case_or_dotted_or_path_tokens", "camel_case_tokens",
  "version_numbers", "mid_sentence_capitalised_words",
]
